name: Hockeypicks Live Game Loop

on:
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single gate/inference iteration and exit"
        type: boolean
        default: true
      dry_run:
        description: "Evaluate the gate without running inference or committing"
        type: boolean
        default: false
  # Dynamic game-wave updates (Tims pre-lock T-20m, puck-drop waves +3m, and 35m
  # LIVE/CRIT refreshes) are dispatched externally by Google Apps Script
  # (scripts/gas_hockeypicks_dispatcher.gs) via workflow_dispatch with `once: true`
  # so runners finish in ~1 minute instead of holding multi-hour sleep loops.

permissions:
  contents: write

# Serialize with the full pipeline and the single-shot inference workflow so the
# loop cannot race them on docs/data.json.
concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  live-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Window Loop
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.once }}" = "true" ]; then ARGS="$ARGS --once"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.live_loop --interval-seconds 300 $ARGS
