name: Hockeypicks Live Game Loop

on:
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single gate/inference iteration and exit"
        type: boolean
        default: true
      dry_run:
        description: "Evaluate the gate without running inference or committing"
        type: boolean
        default: false
  # Daily live window wake-ups (12:15 PM, 6:40 PM, 10:15 PM ET, plus backup
  # wake-ups at 1:15 PM, 2:15 PM, 7:40 PM, 8:40 PM, 11:15 PM ET) are dispatched
  # externally by Google Apps Script (scripts/gas_hockeypicks_dispatcher.gs) via
  # workflow_dispatch on exact America/New_York wall-clock times.

permissions:
  contents: write

# Serialize with the full pipeline and the single-shot inference workflow so the
# loop cannot race them on docs/data.json.
concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  live-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Window Loop
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.once }}" = "true" ]; then ARGS="$ARGS --once"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m src.live_loop --interval-seconds 300 $ARGS
