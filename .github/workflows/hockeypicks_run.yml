name: Hockeypicks Automated AI Pipeline

on:
  workflow_dispatch:
  # Thrice-daily ET runs (12:01 AM ET post-midnight Tims release, 10:17 AM ET
  # morning, 4:17 PM ET pre-puck drop) are dispatched externally by Google Apps Script
  # (scripts/gas_hockeypicks_dispatcher.gs) via workflow_dispatch on exact
  # America/New_York wall-clock times.

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-hockeypicks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & End-to-End Smoke Tests
        run: python -m unittest discover -s tests -v

      - name: Restore Cached MoneyPuck & NHL Game Logs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data
          key: hockeypicks-data-${{ github.run_id }}
          restore-keys: |
            hockeypicks-data-

      - name: Execute Hockeypicks AI Training & Inference Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode full

      - name: Commit and Push Predictions & Model Bundles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/injury_history docs/roster_history
          git add docs/data.json docs/latest_run.html docs/tims_history.json docs/tims_boards.json docs/injury_history/ docs/roster_history/ docs/transaction_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Automated Hockeypicks AI Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
