name: Hockeypicks Automated AI Pipeline

on:
  workflow_dispatch:
  schedule:
    # Twice-daily ET runs (10:17 AM ET morning release + 4:17 PM ET pre-puck drop)
    - cron: '17 14 * * *' # 10:17 AM EDT (UTC-4)
    - cron: '17 15 * * *' # 10:17 AM EST (UTC-5)
    - cron: '17 20 * * *' # 4:17 PM EDT (UTC-4)
    - cron: '17 21 * * *' # 4:17 PM EST (UTC-5)

permissions:
  contents: write

jobs:
  run-hockeypicks:
    runs-on: ubuntu-latest

    steps:
      - name: Check EDT/EST Schedule Match
        id: tz_check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(TZ="America/New_York" date +%z)
            if [ "$OFFSET" = "-0400" ] && [ "${{ github.event.schedule }}" != "17 14 * * *" ] && [ "${{ github.event.schedule }}" != "17 20 * * *" ]; then
              echo "Skipping EST cron (${{ github.event.schedule }}) during EDT (-0400)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$OFFSET" = "-0500" ] && [ "${{ github.event.schedule }}" != "17 15 * * *" ] && [ "${{ github.event.schedule }}" != "17 21 * * *" ]; then
              echo "Skipping EDT cron (${{ github.event.schedule }}) during EST (-0500)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Cached MoneyPuck & NHL Game Logs
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data
          key: hockeypicks-data-${{ github.run_id }}
          restore-keys: |
            hockeypicks-data-

      - name: Execute Hockeypicks AI Pipeline
        if: steps.tz_check.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py

      - name: Commit and Push Predictions & Model Bundles
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/latest_run.html models/
          if ! git diff --staged --quiet; then
            git commit -m "Automated Hockeypicks AI Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
