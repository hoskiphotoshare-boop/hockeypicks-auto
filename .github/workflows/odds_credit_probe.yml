name: Odds Usage Read

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read usage (0 credits)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          key = os.environ["ODDS_API_KEY"]
          req = urllib.request.Request(f"https://api.the-odds-api.com/v4/sports/?apiKey={key}")
          with urllib.request.urlopen(req, timeout=30) as r:
              h = dict(r.headers)
          print(f"used={h.get('x-requests-used')} remaining={h.get('x-requests-remaining')} last={h.get('x-requests-last')}")
          PY
