name: Odds Credit Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Measure 10-bookmaker credit cost
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          KEY = os.environ["ODDS_API_KEY"]
          BOOKS = "pinnacle,lowvig,betonlineag,draftkings,fanduel,betmgm,betrivers,espnbet,bovada,playnow_ca"

          def get(url):
              req = urllib.request.Request(url, headers={"Accept-Encoding": "gzip"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, dict(r.headers), r.read()

          base = "https://api.the-odds-api.com/v4"
          _, h0, _ = get(f"{base}/sports/?apiKey={KEY}")
          before = h0.get("x-requests-used")

          url = (f"{base}/sports/icehockey_nhl/odds/?apiKey={KEY}"
                 f"&bookmakers={BOOKS}&markets=h2h&oddsFormat=decimal")
          s1, h1, body = get(url)
          after = h1.get("x-requests-used")

          games = json.loads(body.decode())
          books_returned = sorted({b.get("key") for g in games for b in g.get("bookmakers", [])})
          print(f"books_requested={len(BOOKS.split(','))} status={s1}")
          print(f"x_requests_last={h1.get('x-requests-last')}")
          print(f"used_before={before} used_after={after} delta={int(after)-int(before) if before and after else 'n/a'}")
          print(f"remaining={h1.get('x-requests-remaining')} games={len(games)} books_returned={len(books_returned)}")
          print("returned=" + ",".join(books_returned))
          PY
