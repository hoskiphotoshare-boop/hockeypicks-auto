name: Hockeypicks Player Stat Models (Weekly/Monthly)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "evaluate = weekly recalibration; retrain = monthly tree retrain"
        required: true
        default: "evaluate"
        type: choice
        options:
          - evaluate
          - retrain
  # Dispatched by Google Apps Script:
  #   weekly Monday 09:00 ET  -> mode=evaluate
  #   first Monday 09:15 ET   -> mode=retrain

permissions:
  contents: write

concurrency:
  group: hockeypicks-player-models
  cancel-in-progress: false

jobs:
  run-player-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Cached Player Game History
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data
          key: hockeypicks-data-${{ github.run_id }}
          restore-keys: |
            hockeypicks-data-

      - name: Refresh Player Game Logs
        run: python scripts/collect_player_games.py --refresh-hours 6

      - name: Evaluate / Retrain
        run: |
          if [ "${{ inputs.mode }}" = "retrain" ]; then
            python scripts/eval_player_stat_models.py
          else
            python scripts/recalibrate_player_stats.py
          fi

      - name: Commit Model Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.mode }}" = "retrain" ]; then
            git add models/player_stat_bundles.joblib models/player_stat_metrics.json models/player_stat_calibration.json
            MSG="Player models: monthly retrain ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
          else
            git add models/player_stat_calibration.json models/player_stat_drift.json
            MSG="Player models: weekly recalibration ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
          fi
          if ! git diff --staged --quiet; then
            git commit -m "$MSG"
            git pull --rebase origin main
            git push origin main
          else
            echo "No model changes to commit."
          fi
