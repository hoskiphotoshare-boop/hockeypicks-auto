name: Hockeypicks Stanley Cup Futures (Weekly)

on:
  workflow_dispatch:
    inputs:
      bankroll:
        description: "Betting bankroll ($) for 1/8 Portfolio Kelly recommendations"
        required: false
        default: "1000"
        type: string
      n_sims:
        description: "Number of Monte Carlo season/playoff simulations"
        required: false
        default: "10000"
        type: string
  # Weekly Monday 10:30 AM ET run is dispatched externally by Google Apps Script
  # (scripts/gas_hockeypicks_dispatcher.gs) via workflow_dispatch.

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-futures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Restore Cached MoneyPuck & NHL Game Logs
        uses: actions/cache@v4
        with:
          path: data
          key: hockeypicks-data-${{ github.run_id }}
          restore-keys: |
            hockeypicks-data-

      - name: Train Futures Model & Simulate Stanley Cup Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m src.cup_futures \
            --data-dir ./data \
            --models-dir ./models \
            --docs-dir ./docs \
            --bankroll "${{ inputs.bankroll || '1000' }}" \
            --n-sims "${{ inputs.n_sims || '10000' }}"

      - name: Commit and Push Stanley Cup Futures & Model Bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cup_futures.json models/futures_game_bundle.joblib
          if ! git diff --staged --quiet; then
            git commit -m "Weekly Stanley Cup Futures Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No futures changes to commit."
          fi
