name: Hockeypicks Live Inference Only

on:
  workflow_dispatch:
    inputs:
      cron:
        description: "Optional scheduled slot cron (e.g. '0 11 * * *') evaluated by infer_gate"
        required: false
        default: ""
        type: string
  # Scheduled triggers are dispatched externally by Google Apps Script
  # (scripts/gas_hockeypicks_dispatcher.gs) via workflow_dispatch on exact
  # America/New_York wall-clock times (11:00 AM, 12:00 PM, 4:30 PM, 10:00 PM ET)
  # to bypass GitHub Actions' best-effort shared cron queue delays/drops.

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check Inference Gate (Odds Windows & Post-Start)
        id: gate
        run: python3 -m src.infer_gate --data-json docs/data.json --event-name "${{ github.event_name }}" --cron "${{ inputs.cron || github.event.schedule }}"

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Live Inference
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode infer

      - name: Commit and Push Live Predictions
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/injury_history docs/roster_history
          git add docs/data.json docs/latest_run.html docs/tims_history.json docs/tims_boards.json docs/injury_history/ docs/roster_history/ docs/transaction_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Live Inference Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
