name: Hockeypicks Live Inference Only

on:
  workflow_dispatch:
  schedule:
    # All entries are ET wall-clock time. GitHub converts each one to UTC and
    # follows daylight saving, so one entry covers both EDT and EST.
    # 10:00 PM ET (day before) — Daily opening odds release & next-day line movements
    - cron: '0 22 * * *'
      timezone: 'America/New_York'
    # 11:00 AM ET — Weekend & holiday early matinee odds release & line movements
    - cron: '0 11 * * *'
      timezone: 'America/New_York'
    # 12:00 PM ET — Daily noon odds release & mid-day line movements
    - cron: '0 12 * * *'
      timezone: 'America/New_York'
    # 4:30 PM ET — Daily pre-game line movements & starting goalie confirmations
    - cron: '30 16 * * *'
      timezone: 'America/New_York'
    # Post-puck-drop inference now runs in the Hockeypicks Live Game Loop workflow,
    # which ticks every 5 minutes inside the game windows instead of relying on 56
    # one-shot scheduler triggers per day.

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Inference Gate (Odds Windows & Post-Start)
        id: gate
        run: python3 -m src.infer_gate --data-json docs/data.json --event-name "${{ github.event_name }}" --cron "${{ github.event.schedule }}"

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Live Inference
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode infer

      - name: Commit and Push Live Predictions
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/latest_run.html docs/tims_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Live Inference Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
