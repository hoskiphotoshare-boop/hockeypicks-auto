name: Hockeypicks Live Inference Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Live Inference
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode infer

      - name: Commit and Push Live Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/latest_run.html docs/tims_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Live Inference Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
