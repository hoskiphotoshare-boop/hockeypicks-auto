name: Hockeypicks Live Inference Only

on:
  workflow_dispatch:
  schedule:
    # 10:00 PM EPT (day before) — Daily opening odds release & next-day line movements
    - cron: '0 2 * * *'    # EDT (UTC-4)
    - cron: '0 3 * * *'    # EST (UTC-5)
    # 11:00 AM EPT — Weekend & holiday early matinee odds release & line movements
    - cron: '0 15 * * *'   # EDT (UTC-4)
    - cron: '0 16 * * *'   # EST (UTC-5)
    # 4:30 PM EPT — Daily pre-game line movements & starting goalie confirmations
    - cron: '30 20 * * *'  # EDT (UTC-4)
    - cron: '30 21 * * *'  # EST (UTC-5)
    # Post-puck-drop reactive ticks (+3 min after quarter-hour NHL game starts)
    - cron: '3,18,33,48 15-23,0-4 * * *'

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Inference Gate (Odds Windows & Post-Start)
        id: gate
        run: python3 -m src.infer_gate --data-json docs/data.json --event-name "${{ github.event_name }}" --cron "${{ github.event.schedule }}"

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Live Inference
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode infer

      - name: Commit and Push Live Predictions
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/latest_run.html docs/tims_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Live Inference Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
