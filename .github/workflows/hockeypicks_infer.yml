name: Hockeypicks Live Inference Only

on:
  workflow_dispatch:
  schedule:
    # Check 3 min past every quarter-hour across NHL game hours (~10 AM ET - 12:48 AM ET)
    - cron: '3,18,33,48 15-23,0-4 * * *'

permissions:
  contents: write

concurrency:
  group: hockeypicks-repo-write
  cancel-in-progress: false

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Post-Start Inference Gate
        id: gate
        run: python3 -m src.infer_gate --data-json docs/data.json --event-name "${{ github.event_name }}"

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Fast Live Inference
        if: steps.gate.outputs.should_run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main_pipeline.py --mode infer

      - name: Commit and Push Live Predictions
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/latest_run.html docs/tims_history.json models/
          if ! git diff --staged --quiet; then
            git commit -m "Live Inference Update ($(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET'))"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
